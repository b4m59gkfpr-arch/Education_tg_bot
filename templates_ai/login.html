{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
  <form class="panel" method="post" action="{{ url_for('login') }}">
    <h2 style="margin-bottom: 20px; text-align: center;">Вход для преподавателей</h2>
    
    <label style="display: block; margin-bottom: 15px;">
      Электронная почта
      <input type="email" name="email" placeholder="example@email.com" required style="width: 100%; margin-top: 5px;">
    </label>
    
    <label style="display: block; margin-bottom: 15px;">
      Пароль
      <div class="password-wrapper" style="margin-top: 5px;">
        <input type="password" name="password" placeholder="••••••••" required style="width: 100%;">
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility(this)" title="Показать/скрыть пароль">
          <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
    </label>
    
    <button type="submit" style="width: 100%; margin-top: 15px; padding: 10px;">Войти</button>
    
    <p style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-secondary);">
      Нет аккаунта? <a href="{{ url_for('register') }}" style="color: var(--accent); text-decoration: none; font-weight: 500;">Зарегистрироваться</a>
    </p>
  </form>
</div>

<script>
  function togglePasswordVisibility(button) {
    const input = button.parentElement.querySelector('input');
    const eyeOpen = button.querySelector('.eye-open');
    const eyeClosed = button.querySelector('.eye-closed');
    
    if (input.type === 'password') {
      input.type = 'text';
      eyeOpen.style.display = 'none';
      eyeClosed.style.display = 'block';
    } else {
      input.type = 'password';
      eyeOpen.style.display = 'block';
      eyeClosed.style.display = 'none';
    }
  }
</script>

{% endblock %}
